<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Ecommerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="logo">
          <span class="logo-mark">▲</span>
          <span class="logo-text">TECHSTORE</span>
        </div>
        <p class="header-sub">Catálogo de Produtos</p>
      </div>
    </header>

    <section class="controls">
      <div class="controls-inner">
        <div class="control-group">
          <label for="search">Buscar produto</label>
          <input
            type="text"
            id="search"
            placeholder="Digite o nome..."
            autocomplete="off"
          />
        </div>
        <div class="control-group">
          <label for="category">Categoria</label>
          <select id="category">
            <option value="">Todas</option>
          </select>
        </div>
        <button id="btnRender">↺ Renderizar</button>
      </div>
    </section>

    <main>
      <div id="product-list"></div>
    </main>

    <aside id="product-details">
      <p class="details-placeholder">Clique em "Ver detalhes" para exibir informações completas do produto.</p>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
